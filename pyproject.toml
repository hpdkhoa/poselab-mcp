[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "poselab-mcp"
version = "0.2.1"
description = "An MCP server of measured spatial answers for posing first-person arms and a rifle in Blender: clipping depth, what the eye sees, and a solver that says which goals no move can meet."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Khoa Hoang" }]
requires-python = ">=3.10"
keywords = ["mcp", "blender", "animation", "first-person", "spatial-reasoning", "game-development"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = ["mcp>=2.0,<3", "pillow>=10"]

[project.optional-dependencies]
bench = ["anthropic>=1.12,<2"]

[project.urls]
Homepage = "https://github.com/hpdkhoa/poselab-mcp"
Issues = "https://github.com/hpdkhoa/poselab-mcp/issues"

[project.scripts]
poselab-mcp = "poselab_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/poselab_mcp"]
